# Trail network built by insert_trails.py: OSM paths, marked by the Parc national des Calanques where it marks them

# OSM ways kept as trails, fetched from Overpass. Instances often answer 504 when busy, so they are tried in turn.
# The OSM API's map call is no fallback: it refuses areas of more than 50,000 nodes.
overpass_urls:
  - https://overpass-api.de/api/interpreter
  - https://overpass.kumi.systems/api/interpreter
highway: [path, footway, track, steps, bridleway, cycleway]

# Marked trails of the Parc national des Calanques (balisage, etiq_num), on the Métropole's open data portal
park_url: https://data.ampmetropole.fr/api/explore/v2.1/catalog/datasets/fr-sentiers-balises-sur-le-parc-national-des-calanques/exports/geojson

# Matching, in metres (see lib/trails.py). An OSM piece is marked like a park trail when at least `min_overlap` of it
# lies within `tolerance` of it, and when it runs along it: its projection on the park trail is at least `min_span` of
# its length (0.7 is about 45°).
# Unmarked gaps up to `max_gap` between two pieces with the same marking get it too.
# Park trails further than `tolerance` from any OSM way are added as is when longer than `min_park_length`.
piece_length: 20
tolerance: 12
min_overlap: 0.5
min_span: 0.7
max_gap: 60
min_park_length: 30

# Trail coverage by Strava activities (summary polylines, within about 5 m of the full tracks): a piece of trail is
# covered by an activity when at least `min_overlap` of it lies within `tolerance` of its track and it runs along it.
# Along each trail, unrun gaps up to `max_gap` between two covered stretches are covered too, and so are unrun trails
# up to `max_connector` with both ends on covered ones (longer ones can be shortcuts really not run).
coverage:
  activity_types: [Run, TrailRun, Hike, Walk]
  tolerance: 15
  min_overlap: 0.5
  min_span: 0.7
  max_gap: 60
  max_connector: 30

# Zones the network is built for, as polygons of (lon, lat) points
zones:
